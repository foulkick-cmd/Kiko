name: Android Build

on:
  push:
    branches:
      - claude/smart-video-compressor-android-ql5rum
  workflow_dispatch: {}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run core-logic unit tests
        run: ./gradlew :core-logic:test --no-daemon --stacktrace

      # Release signing. Two paths, resolved at runtime and never committed to the repo:
      #  1. If the RELEASE_KEYSTORE_BASE64/RELEASE_KEYSTORE_PASSWORD/RELEASE_KEY_ALIAS/
      #     RELEASE_KEY_PASSWORD repository secrets are set AND the decoded keystore actually
      #     opens with the given password, use it (a stable signing identity across builds, so
      #     future updates install over old ones). The keystore is verified openable with
      #     `keytool -list` before being trusted -- a secret that decodes to something unusable
      #     (e.g. mangled on copy/paste into the GitHub UI) is logged as a warning and skipped
      #     rather than failing the whole build.
      #  2. Otherwise (no secret set, or the secret didn't check out), keytool generates a fresh
      #     keystore on the runner itself with a runner-generated random password -- no secret to
      #     create, no long string to copy. This trades away a stable signing identity (each such
      #     run's key is different, so an APK from one run won't upgrade-install over another) for
      #     a signed, installable APK with zero manual secret handling.
      # The password is masked in the log and the keystore file is deleted at the end of the job
      # either way.
      - name: Prepare release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          USE_SECRET=false

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH" 2>/dev/null || true
            if [ -s "$KEYSTORE_PATH" ] && keytool -list -keystore "$KEYSTORE_PATH" -storepass "$RELEASE_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "Using the RELEASE_KEYSTORE_BASE64 repository secret for signing (verified openable)."
              USE_SECRET=true
              KS_PASSWORD="$RELEASE_KEYSTORE_PASSWORD"
              KS_ALIAS="$RELEASE_KEY_ALIAS"
              KS_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            else
              echo "::warning::RELEASE_KEYSTORE_BASE64 is set but the decoded keystore could not be opened with RELEASE_KEYSTORE_PASSWORD (corrupted on paste, or a password mismatch). Falling back to an ephemeral runtime-generated keystore instead of failing the build."
              rm -f "$KEYSTORE_PATH"
            fi
          fi

          if [ "$USE_SECRET" = false ]; then
            echo "Generating an ephemeral release keystore for this run."
            KS_PASSWORD=$(openssl rand -hex 24)
            KS_ALIAS="smartvideocompressor"
            KS_KEY_PASSWORD="$KS_PASSWORD"
            echo "::add-mask::$KS_PASSWORD"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 4096 \
              -validity 10000 \
              -storetype PKCS12 \
              -storepass "$KS_PASSWORD" \
              -keypass "$KS_KEY_PASSWORD" \
              -dname "CN=Smart Video Compressor, OU=Personal, O=foulkick, L=NA, ST=NA, C=US"
          fi

          echo "::add-mask::$KS_PASSWORD"
          echo "::add-mask::$KS_KEY_PASSWORD"
          {
            echo "RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "RELEASE_KEYSTORE_PASSWORD=$KS_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KS_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KS_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under app/build/outputs/apk/release"
            exit 1
          fi
          echo "Resolved APK: $APK"
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "=== SHA-256 ==="
          sha256sum "$APK"

      - name: Clean up release keystore
        if: always()
        run: rm -f "$RELEASE_KEYSTORE_PATH"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-video-compressor-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload core-logic test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-logic-test-report
          path: core-logic/build/reports/tests/test
          if-no-files-found: ignore
