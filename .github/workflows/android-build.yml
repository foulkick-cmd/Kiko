name: Android Build

on:
  push:
    branches:
      - claude/smart-video-compressor-android-ql5rum
  workflow_dispatch: {}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run core-logic unit tests
        run: ./gradlew :core-logic:test --no-daemon --stacktrace

      - name: Build release APK
        id: assemble_release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      # TEMPORARY diagnostic step: this environment cannot reach Google's Maven repo, so the
      # exact Media3 1.5.1 API surface used in VideoCompressor.kt was written from unverifiable
      # recall. Ground-truth it directly against the jars this CI run already downloaded, rather
      # than guessing again. Remove once the real build is green.
      #
      # Round 1 already confirmed: Effects lives in androidx.media3.transformer (not .common),
      # and VideoEncoderSettings has NO bitrate-mode constants on it at all (bitrateMode is a
      # plain int) -- so this round also dumps DefaultEncoderFactory, Composition,
      # EditedMediaItem(Sequence), Transformer, ProgressHolder, effect.Presentation,
      # effect.FrameDropEffect, and the platform's MediaCodecInfo.EncoderCapabilities (the likely
      # real source of the bitrate-mode int constants).
      - name: Inspect real Media3 API surface (temporary diagnostic)
        if: steps.assemble_release.outcome == 'failure'
        run: |
          set -x
          mkdir -p /tmp/media3_classes
          find ~/.gradle/caches -path "*androidx.media3*" \( -name "*.aar" -o -name "*.jar" \) 2>/dev/null
          for aar in $(find ~/.gradle/caches -path "*androidx.media3*" -name "*.aar" 2>/dev/null); do
            d=$(mktemp -d)
            unzip -oq "$aar" -d "$d" classes.jar 2>/dev/null || true
            if [ -f "$d/classes.jar" ]; then
              unzip -oq "$d/classes.jar" -d /tmp/media3_classes
            fi
          done
          for jar in $(find ~/.gradle/caches -path "*androidx.media3*" -name "*.jar" ! -name "*sources*" 2>/dev/null); do
            unzip -oq "$jar" -d /tmp/media3_classes 2>/dev/null || true
          done

          ANDROID_JAR=$(find "$ANDROID_HOME" -path "*platforms/android-35*" -name "android.jar" 2>/dev/null | head -1)
          echo "ANDROID_JAR=$ANDROID_JAR"

          for cls in \
            androidx.media3.transformer.Effects \
            'androidx.media3.transformer.DefaultEncoderFactory$Builder' \
            androidx.media3.transformer.DefaultEncoderFactory \
            androidx.media3.transformer.Composition \
            'androidx.media3.transformer.Composition$Builder' \
            'androidx.media3.transformer.Composition$HdrMode' \
            androidx.media3.transformer.EditedMediaItem \
            'androidx.media3.transformer.EditedMediaItem$Builder' \
            androidx.media3.transformer.EditedMediaItemSequence \
            'androidx.media3.transformer.EditedMediaItemSequence$Builder' \
            androidx.media3.transformer.Transformer \
            'androidx.media3.transformer.Transformer$Builder' \
            'androidx.media3.transformer.Transformer$Listener' \
            androidx.media3.transformer.ProgressHolder \
            androidx.media3.transformer.ExportResult \
            androidx.media3.transformer.ExportException \
          ; do
            echo "=== javap $cls ==="
            javap -p -cp /tmp/media3_classes "$cls" 2>&1 || true
          done

          for aar in $(find ~/.gradle/caches -path "*androidx.media3*effect*" -name "*.aar" 2>/dev/null); do
            d=$(mktemp -d)
            unzip -oq "$aar" -d "$d" classes.jar 2>/dev/null || true
            [ -f "$d/classes.jar" ] && unzip -oq "$d/classes.jar" -d /tmp/media3_classes
          done
          for cls in androidx.media3.effect.Presentation androidx.media3.effect.FrameDropEffect; do
            echo "=== javap $cls ==="
            javap -p -cp /tmp/media3_classes "$cls" 2>&1 || true
          done

          if [ -n "$ANDROID_JAR" ]; then
            echo "=== javap android.media.MediaCodecInfo\$EncoderCapabilities (platform android.jar) ==="
            javap -p -cp "$ANDROID_JAR" 'android.media.MediaCodecInfo$EncoderCapabilities' 2>&1 || true
          else
            echo "=== android.jar not found under \$ANDROID_HOME ==="
          fi

      - name: Mark job as failed (assembleRelease did not succeed)
        if: steps.assemble_release.outcome == 'failure'
        run: exit 1

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-video-compressor-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload core-logic test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-logic-test-report
          path: core-logic/build/reports/tests/test
          if-no-files-found: ignore
