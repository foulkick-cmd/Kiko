name: Build MHI Remote

on:
  push:
    branches: [ MHIRemote ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "MHIRemote-$VER.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MHIRemote-${{ env.VER }}
          path: MHIRemote-${{ env.VER }}.apk

      - name: Publish as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mhiremote-${{ github.run_number }}
          name: MHI Remote ${{ env.VER }} (build ${{ github.run_number }})
          files: MHIRemote-${{ env.VER }}.apk
