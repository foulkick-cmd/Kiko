plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kareem.aqarexittool'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kareem.aqarexittool'
        minSdk 29
        targetSdk 34
        versionCode 19
        versionName '1.13'
    }

    // fixed key so every new build installs as an update over the previous one
    signingConfigs {
        fixed {
            storeFile file('aqarfinder.jks')
            storePassword 'aqarfinder123'
            keyAlias 'aqarfinder'
            keyPassword 'aqarfinder123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
