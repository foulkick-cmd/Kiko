plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kareem.aqarexittool'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kareem.aqarexittool'
        minSdk 29
        targetSdk 34
        versionCode 32
        versionName '1.17.1'
    }

    // fixed key so every new build installs as an update over the previous one
    signingConfigs {
        fixed {
            storeFile file('aqarfinder.jks')
            storePassword 'aqarfinder123'
            keyAlias 'aqarfinder'
            keyPassword 'aqarfinder123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
}
